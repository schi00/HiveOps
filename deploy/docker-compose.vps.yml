# VPS coexistence stack: HiveOps runs alongside HiveCrew on the same host.
#
# - Shares the HiveCrew postgres container (dedicated `hiveops` database,
#   dedicated `hiveops_app` login) and redis container (logical DB index 1)
#   over the external `app_internal` network created by HiveCrew's compose.
# - Ingress stays behind hivecrew-caddy; add the two sslip.io site blocks
#   (hiveops.* -> hiveops-landing:3000, api-hiveops.* -> hiveops-api:8080)
#   to /opt/hivecrew/app/Caddyfile and `caddy reload`.
# - No host ports are published by this stack.
#
# One-time DB bootstrap (run as postgres superuser inside hivecrew-postgres):
#   psql -c "CREATE ROLE hiveops_app LOGIN PASSWORD '<HIVEOPS_DB_PASSWORD>';"
#   psql -c "CREATE DATABASE hiveops;"
#   psql -d hiveops -f bootstrap.postgresql.sql   (objects owned by postgres)
#   psql -d hiveops -c "GRANT CONNECT ON DATABASE hiveops TO hiveops_app;
#     GRANT USAGE ON SCHEMA public TO hiveops_app;
#     GRANT SELECT,INSERT,UPDATE,DELETE ON ALL TABLES IN SCHEMA public TO hiveops_app;
#     GRANT USAGE,SELECT ON ALL SEQUENCES IN SCHEMA public TO hiveops_app;
#     ALTER DEFAULT PRIVILEGES IN SCHEMA public
#       GRANT SELECT,INSERT,UPDATE,DELETE ON TABLES TO hiveops_app;"
#   RLS stays enforced for the non-owner role (ENABLE ROW LEVEL SECURITY is
#   already applied by the bootstrap; FORCE is unnecessary for non-owners).
#
# Env file (/opt/hiveops/.env):
#   HIVEOPS_DB_PASSWORD, JWT_KEY, ADMIN_API_KEY, SK_OPENROUTER_API_KEY,
#   plus optional SK_ACTIVE_PROFILE / NEXT_PUBLIC_DASHBOARD_URL overrides.

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: hiveops-api:latest
    container_name: hiveops-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Host=hivecrew-postgres;Port=5432;Database=hiveops;Username=hiveops_app;Password=${HIVEOPS_DB_PASSWORD}"
      Redis__ConnectionString: "hivecrew-redis:6379,defaultDatabase=1"
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "HiveOps"
      Jwt__Audience: "HiveOpsUsers"
      HiveIdentity__Key: "${HIVE_IDENTITY_KEY:-}"
      HiveIdentity__Issuer: "${HIVE_IDENTITY_ISSUER:-https://accounts.hivecorp.com.ar}"
      HiveIdentity__Audience: "${HIVE_IDENTITY_AUDIENCE:-hive-products}"
      Admin__ApiKey: "${ADMIN_API_KEY}"
      Ticketing__InboundSecret: "${TICKETING_INBOUND_SECRET:-}"
      Auth__Bootstrap__SeedUsers: "${AUTH_SEED_USERS:-true}"
      Git__RepoPath: "/tmp/hiveops-git-work"
      Git__WorkspacesRoot: "/tmp/hiveops-git-workspaces"
      HiveOps__DataProtectionKeysPath: "/app/data/dataprotection"
      HiveOps__Deployment__Mode: "SaaS"
      HiveOps__Deployment__Billing: "None"
      Secrets__UseAws: "false"
      SemanticKernel__ActiveProfile: "${SK_ACTIVE_PROFILE:-Production}"
      SemanticKernel__OpenRouter__ApiKey: "${SK_OPENROUTER_API_KEY:-}"
      # The Production profile ships disabled in appsettings; enable it here so
      # agent LLM paths (planner, root-cause, policy interpreter) actually run.
      SemanticKernel__Profiles__Production__Enabled: "${SK_PROD_PROFILE_ENABLED:-true}"
      SemanticKernel__Profiles__Production__ModelId: "${SK_PROD_MODEL_ID:-meta-llama/llama-3.3-70b-instruct:free}"
      # Chat provider failover chain — the deployed key is a Groq key, so route
      # through Groq's OpenAI-compatible endpoint instead of OpenRouter.
      SemanticKernel__Providers__0__Enabled: "${SK_GROQ_ENABLED:-true}"
      SemanticKernel__Providers__0__Name: "groq"
      SemanticKernel__Providers__0__Endpoint: "https://api.groq.com/openai/v1"
      SemanticKernel__Providers__0__ModelId: "${SK_GROQ_MODEL_ID:-openai/gpt-oss-120b}"
      SemanticKernel__Providers__0__ApiKey: "${GROQ_API_KEY:-}"
      # Fallback LLM provider slot — inert until SK_FALLBACK_ENABLED=true plus a
      # key are provided in .env. Keeps a single-provider outage from killing
      # intake/triage/RCA for every tenant.
      SemanticKernel__Providers__1__Enabled: "${SK_FALLBACK_ENABLED:-false}"
      SemanticKernel__Providers__1__Name: "${SK_FALLBACK_NAME:-openai}"
      SemanticKernel__Providers__1__Endpoint: "${SK_FALLBACK_ENDPOINT:-https://api.openai.com/v1}"
      SemanticKernel__Providers__1__ModelId: "${SK_FALLBACK_MODEL_ID:-gpt-4o-mini}"
      SemanticKernel__Providers__1__ApiKey: "${SK_FALLBACK_API_KEY:-}"
      # Reporter notifications by email — inert until SMTP_* are provided in .env.
      Email__SmtpHost: "${SMTP_HOST:-}"
      Email__SmtpPort: "${SMTP_PORT:-587}"
      Email__EnableSsl: "${SMTP_ENABLE_SSL:-true}"
      Email__Username: "${SMTP_USERNAME:-}"
      Email__Password: "${SMTP_PASSWORD:-}"
      Email__FromAddress: "${SMTP_FROM_ADDRESS:-}"
      Email__FromName: "${SMTP_FROM_NAME:-HiveOps}"
      # HiveArena sandbox gate — validation required before any auto-deployed
      # code fix; with no Arena service configured this parks fixes at
      # AwaitingApproval instead of deploying unvalidated changes.
      HiveArena__Publisher__Enabled: "${HIVEARENA_PUBLISHER_ENABLED:-false}"
      HiveArena__Publisher__HiveArenaBaseUrl: "${HIVEARENA_BASE_URL:-}"
      HiveArena__Publisher__HiveArenaApiKey: "${HIVEARENA_API_KEY:-}"
      HiveArena__Publisher__RequireValidationForAutoDeploy: "${HIVEARENA_REQUIRE_VALIDATION:-true}"
      # Inbound: must equal HiveArena HiveOpsCallback:SharedSecret (see /opt/hivearena/.env).
      HiveOps__HiveArenaInbound__SharedSecret: "${HIVEARENA_CALLBACK_SECRET:-}"
      # Mercado Pago — shared HiveCorp account; webhook routing is per-preference.
      MercadoPago__AccessToken: "${MERCADOPAGO_ACCESS_TOKEN:-}"
      MercadoPago__NotificationBaseUrl: "${MP_NOTIFICATION_BASE:-https://api.ops.hivecorp.com.ar}"
      MercadoPago__BackUrl: "${MP_BACK_URL:-https://ops.hivecorp.com.ar/dashboard/}"
      Billing__UsdToArsRate: "${USD_TO_ARS_RATE:-1500}"
      Billing__ChargeCurrency: "${CHARGE_CURRENCY:-ARS}"
    volumes:
      - hiveops_dataprotection:/app/data/dataprotection
      - hiveops_gitwork:/tmp/hiveops-git-work
      - hiveops_git_workspaces:/tmp/hiveops-git-workspaces
    networks:
      - app_internal

  landing:
    build:
      context: ../apps/hiveops-landing
      args:
        NEXT_PUBLIC_DASHBOARD_URL: "${NEXT_PUBLIC_DASHBOARD_URL:-https://app.ops.hivecorp.com.ar/dashboard/}"
    image: hiveops-landing:latest
    container_name: hiveops-landing
    restart: unless-stopped
    networks:
      - app_internal

volumes:
  hiveops_dataprotection:
  hiveops_gitwork:
  hiveops_git_workspaces:

networks:
  app_internal:
    external: true
