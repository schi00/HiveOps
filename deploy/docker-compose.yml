# Self-hosted stack: PostgreSQL + Redis + HiveOps API.
# From repo root: docker compose -f deploy/docker-compose.yml up --build
# Then run DB bootstrap once (see docs/operations.md): ./db/bootstrap.sh

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "hiveops"
      POSTGRES_PASSWORD: "HiveOps-Local-PG-2026-Strong!"
      POSTGRES_DB: "hive"
    ports:
      - "5432:5432"
    volumes:
      - hiveops_pgdata:/var/lib/postgresql/data
      - ../db/bootstrap.postgresql.sql:/docker-entrypoint-initdb.d/bootstrap.postgresql.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiveops -d hive"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=hive;Username=hiveops;Password=HiveOps-Local-PG-2026-Strong!"
      Redis__ConnectionString: "redis:6379"
      Jwt__Key: "HiveOps-Docker-Dev-Jwt-Key-32-Chars!!"
      Admin__ApiKey: "docker-compose-admin-key-local-only-32"
      Git__RepoPath: "/tmp/hiveops-git-work"
      Git__WorkspacesRoot: "/tmp/hiveops-git-workspaces"
      HiveOps__DataProtectionKeysPath: "/app/data/dataprotection"
      HiveOps__Deployment__Mode: "SelfHosted"
      HiveOps__Deployment__Billing: "None"
      Secrets__UseAws: "false"
    volumes:
      - hiveops_dataprotection:/app/data/dataprotection
      - hiveops_gitwork:/tmp/hiveops-git-work
      - hiveops_git_workspaces:/tmp/hiveops-git-workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  hiveops_pgdata:
  hiveops_dataprotection:
  hiveops_gitwork:
  hiveops_git_workspaces:
