# Ephemeral dependencies for HiveArena proving-ground runs.
# Used by HiveArena:ProvingGround:SetupCommand / TeardownCommand to give
# tenant test suites (e.g. HiveCrew.IntegrationTests) a real PostgreSQL.
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: hivearena-pg
    environment:
      POSTGRES_PASSWORD: Your_strong_password1!
      POSTGRES_DB: hive_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
