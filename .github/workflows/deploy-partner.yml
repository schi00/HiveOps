name: Deploy to Design Partner

on:
  workflow_dispatch:
    inputs:
      partnerId:
        description: 'Partner/Tenant identifier'
        required: true
      env:
        description: 'Environment (dev/staging/prod)'
        required: true
        default: 'dev'
      ref:
        description: 'Git ref (branch or tag)'
        required: true
        default: 'main'
      incidentId:
        description: 'Incident ID to update via callback (optional)'
        required: false
      isRollback:
        description: 'If true, execute rollback to previous known good state'
        required: false
        default: 'false'
      imageName:
        description: 'Container image name (owner/name) for GHCR'
        required: false
        default: '${{ github.repository }}'

jobs:
  deploy:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    env:
      CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
      CI_HMAC: ${{ secrets.CI_HMAC }}
      REGISTRY: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build -c Release

      - name: Set image variables
        id: img
        run: |
          IMAGE_NAME="${{ github.event.inputs.imageName }}"
          IMAGE_NAME_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "image=${IMAGE_NAME_LOWER}" >> $GITHUB_OUTPUT
          echo "sha=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push image (non-rollback only)
        if: ${{ github.event.inputs.isRollback != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.img.outputs.image }}:${{ steps.img.outputs.sha }}

      - name: Pretend provisioning (demo)
        run: |
          echo "Provisioning partner ${{ github.event.inputs.partnerId }} in ${{ github.event.inputs.env }}..."
          sleep 5

      - name: Callback DEPLOYING (optional)
        if: ${{ env.CALLBACK_URL != '' && env.CI_HMAC != '' && github.event.inputs.incidentId != '' && github.event.inputs.isRollback != 'true' }}
        shell: bash
        run: |
          RUN_ID=${{ github.run_id }}
          LOG_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(jq -n --arg iid "${{ github.event.inputs.incidentId }}" --arg rid "$RUN_ID" --arg url "$LOG_URL" '{incidentId: $iid, status:"DEPLOYING", runId:$rid, logUrl:$url}')
          SIG=$(printf "%s" "$PAYLOAD" | openssl dgst -sha256 -hmac "$CI_HMAC" | awk '{print $2}')
          TS=$(date +%s)
          curl -sS -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-CI-Timestamp: $TS" \
            -H "X-CI-Signature: $SIG" \
            --data "$PAYLOAD" || true

      - name: Deploy or Rollback (demo)
        run: |
          if [ "${{ github.event.inputs.isRollback }}" = "true" ]; then
            echo "Rolling back to previous known good state..."
            # Real rollback: resolve stable tag for this partner and simulate deploy of that artifact
            STABLE_TAG="partner-${{ github.event.inputs.partnerId }}-stable"
            if git rev-parse "$STABLE_TAG" >/dev/null 2>&1; then
              STABLE_SHA=$(git rev-list -n 1 "$STABLE_TAG")
              echo "Resolved stable tag $STABLE_TAG at $STABLE_SHA"
              echo "Would deploy image: ${{ env.REGISTRY }}/${{ steps.img.outputs.image }}:$STABLE_SHA"
            else
              echo "Stable tag $STABLE_TAG not found; cannot rollback safely"
            fi
            sleep 6
          else
            echo "Deploying..."
            echo "Would deploy image: ${{ env.REGISTRY }}/${{ steps.img.outputs.image }}:${{ steps.img.outputs.sha }}"
            sleep 10
          fi

      - name: REAL infra deploy/rollback placeholder
        if: ${{ false }}
        run: |
          echo "AQUI CONECTAR CON AWS CLI / TERRAFORM / PULUMI"
          echo "- Despliegue normal: usar imagen ${{ env.REGISTRY }}/${{ steps.img.outputs.image }}:${{ steps.img.outputs.sha }}"
          echo "- Rollback: usar imagen ${{ env.REGISTRY }}/${{ steps.img.outputs.image }}:<STABLE_SHA> resuelta por partner-<partnerId>-stable"

      - name: Tag current commit as stable (non-rollback only)
        if: ${{ github.event.inputs.isRollback != 'true' }}
        run: |
          STABLE_TAG="partner-${{ github.event.inputs.partnerId }}-stable"
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          # Update/move the stable tag to current HEAD
          if git rev-parse "$STABLE_TAG" >/dev/null 2>&1; then
            git tag -f "$STABLE_TAG" "$GITHUB_SHA"
          else
            git tag "$STABLE_TAG" "$GITHUB_SHA"
          fi
          git push origin "$STABLE_TAG" --force

      - name: Callback SUCCESS/FAILED (optional)
        if: ${{ env.CALLBACK_URL != '' && env.CI_HMAC != '' && github.event.inputs.incidentId != '' }}
        shell: bash
        run: |
          STATUS=SUCCESS
          RUN_ID=${{ github.run_id }}
          LOG_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ github.event.inputs.isRollback }}" = "true" ]; then
            PAYLOAD=$(jq -n --arg iid "${{ github.event.inputs.incidentId }}" --arg st "$STATUS" --arg rid "$RUN_ID" --arg url "$LOG_URL" '{incidentId: $iid, status:($st), runId:$rid, logUrl:$url, action:"ROLLBACK"}')
          else
            PAYLOAD=$(jq -n --arg iid "${{ github.event.inputs.incidentId }}" --arg st "$STATUS" --arg rid "$RUN_ID" --arg url "$LOG_URL" '{incidentId: $iid, status:$st, runId:$rid, logUrl:$url}')
          fi
          SIG=$(printf "%s" "$PAYLOAD" | openssl dgst -sha256 -hmac "$CI_HMAC" | awk '{print $2}')
          TS=$(date +%s)
          curl -sS -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-CI-Timestamp: $TS" \
            -H "X-CI-Signature: $SIG" \
            --data "$PAYLOAD" || true
