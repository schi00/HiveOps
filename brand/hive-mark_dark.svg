  <!--
    HIVE honeycomb-cube mark (vectorizado).
    Estructura: hexágono exterior relleno + cubo interior concéntrico
    + 6 trapecios radiales idénticos (rotación de 60°, anclados
    vértice-a-vértice entre el hexágono interno y el externo).

    Edición:
      - Color de relleno: atributo fill del primer path.
      - Color de líneas internas: stroke del grupo <g>.
      - Fondo: primer <rect> (eliminarlo para fondo transparente).
      - Geometría: R externo = 22, R interno = 12, centro (32,32).
  -->
  <!-- Hexágono exterior relleno (vértices: top, right-top, right-bottom, bottom, left-bottom, left-top) -->
  <path
     d="M32 10 51.05 21v22L32 54 12.95 43V21Z"
     fill="#F5B323"
     id="path1"
     style="fill:#000000;fill-opacity:1" />
  <!-- Líneas internas: hexágono interior + Y del cubo + 6 radios vértice-a-vértice -->
  <g
     stroke="#171B22"
     stroke-width="2"
     stroke-linejoin="miter"
     id="g4"
     style="stroke:#000000">
    <!-- hexágono interior (mismo centro, R=12) -->
    <path
       d="M32 20 42.39 26v12L32 44 21.61 38V26Z"
       id="path2"
       style="stroke:#f5b323;stroke-opacity:1" />
    <!-- Y interno del cubo: centro → vértices top, lower-left, lower-right -->
    <path
       d="M32 32V20M32 32 21.61 38M32 32l10.39 6"
       id="path3"
       style="stroke:#f5b323;stroke-opacity:1" />
    <!-- 6 radios que dividen el anillo en trapecios idénticos -->
    <path
       d="M 31.846597,9.9079578 31.907958,20 M 51.05,21 42.39,26 m 8.66,17 -8.874765,-5.122723 m -10.422542,15.7017 0.03254,-9.7017 m -19.05,-1 8.66,-5 M 12.95,21 l 8.66,5"
       id="path4"
       style="stroke:#f5b323;fill:#f5b323;fill-opacity:1;stroke-opacity:1"
       sodipodi:nodetypes="cccccccccccc" />
  </g>
  <g
