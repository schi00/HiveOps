  <!--
    HIVE honeycomb-cube mark (vectorizado).
    Estructura: hexágono exterior relleno + cubo interior concéntrico
    + 6 trapecios radiales idénticos (rotación de 60°, anclados
    vértice-a-vértice entre el hexágono interno y el externo).

    Edición:
      - Color de relleno: atributo fill del primer path.
      - Color de líneas internas: stroke del grupo <g>.
      - Fondo: primer <rect> (eliminarlo para fondo transparente).
      - Geometría: R externo = 22, R interno = 12, centro (32,32).
  -->
  <!-- Hexágono exterior relleno (vértices: top, right-top, right-bottom, bottom, left-bottom, left-top) -->
