     d="M32 10 51.05 21v22L32 54 12.95 43V21Z"
     fill="#F5B323"
     id="path1"
     style="fill:#000000;fill-opacity:1" />
  <!-- Líneas internas: hexágono interior + Y del cubo + 6 radios vértice-a-vértice -->
  <g
     stroke="#171B22"
     stroke-width="2"
     stroke-linejoin="miter"
     id="g4"
     style="stroke:#f5b323;fill:#f5b323;fill-opacity:1;stroke-opacity:1">
    <!-- hexágono interior (mismo centro, R=12) -->
    <path
       d="M32 20 42.39 26v12L32 44 21.61 38V26Z"
       id="path2"
       style="stroke:#f5b323;fill:#000000;fill-opacity:1;stroke-opacity:1" />
    <!-- Y interno del cubo: centro → vértices top, lower-left, lower-right -->
    <!-- 6 radios que dividen el anillo en trapecios idénticos -->
