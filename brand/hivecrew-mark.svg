<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- HiveCrew mark: hexagon outline + headset (sales support agent)
       Colors: outer hexagon + headset in product amber. -->
  <path
    d="M32 8 52.8 20v24L32 56 11.2 44V20Z"
    stroke="#F5B323" stroke-width="4" stroke-linejoin="miter"/>
  <!-- headset: headband -->
  <path
    d="M20 38v-5a12 12 0 0 1 24 0v5"
    stroke="#F5B323" stroke-width="3.5" stroke-linecap="round"/>
  <!-- ear pads -->
  <rect x="16.5" y="36" width="7" height="11" rx="3" fill="#F5B323"/>
  <rect x="40.5" y="36" width="7" height="11" rx="3" fill="#F5B323"/>
  <!-- mic boom + tip -->
  <path
    d="M44 47c0 4.4-3.6 8-8 8h-2"
    stroke="#F5B323" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32.5" cy="55" r="1.8" fill="#F5B323"/>
</svg>
