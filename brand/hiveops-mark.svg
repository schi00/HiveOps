<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!--
    HiveOps — AI Support Engineer.
    Misma carcasa que la marca padre (hexágono + anillo de trapecios).
    Núcleo: llave + destornillador cruzados (glyph Heroicons, MIT),
    escalado al 75% y centrado en la cámara interior.
  -->
  <path fill="#00F0FF" d="M32 10 51.05 21v22L32 54 12.95 43V21Z"/>
  <g fill="none" stroke="#000000" stroke-width="2" stroke-linejoin="miter">
